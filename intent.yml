intents:
  - name: CreateUser
    description: "Create a new user in the system"
    actions:
      - type: log
        message: "Creating user..."
      - type: create_user
        username: "alice"

  - name: DeleteUser
    description: "Delete a user from the system"
    actions:
      - type: log
        message: "Deleting user..."
      - type: delete_user
        username: "alice"

  - name: FetchJoke
    description: "Fetch a random joke from API"
    actions:
      - type: log
        message: "Fetching joke..."
      - type: http_get
        url: "https://icanhazdadjoke.com/"
